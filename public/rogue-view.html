<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rogue — 3D View</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>html,body{margin:0;height:100%;background:#0b0f0d;color:#cbd5d0;font-family:system-ui}
header{position:fixed;top:0;left:0;right:0;padding:10px;text-align:center;font-weight:700;z-index:2}
model-viewer{width:100%;height:100%}</style></head>
<body>
<header>Your Rogue — drag to rotate, pinch to zoom</header>
<model-viewer src="/rogue-3d.glb" camera-controls auto-rotate touch-action="pan-y"
  shadow-intensity="1" exposure="1.1" environment-image="neutral"
  camera-orbit="0deg 80deg 2.4m" min-camera-orbit="auto 0deg auto" style="--poster-color:#0b0f0d">
</model-viewer>
</body></html>
