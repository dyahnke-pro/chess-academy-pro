[build]
  command = "npx vite build"
  publish = "dist"

# Proxy voice pack downloads from GitHub Releases (avoids CORS + keeps same domain)
[[redirects]]
  from = "/voice-packs/*"
  to = "https://github.com/dyahnke-pro/chess-academy-pro/releases/download/voice-packs-v1/:splat"
  status = 200
  force = true

# RPG-demo preview branch: open the game directly from the root, so the bare
# preview URL (no /rpg-demo path) still lands on the demo instead of the
# dashboard. Preview-branch only — not on main.
[[redirects]]
  from = "/"
  to = "/rpg-demo"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
