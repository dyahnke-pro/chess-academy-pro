# 🔒 NETLIFY IS DISABLED — NEVER BUILD (David 2026-09-05: "Disable netlify!"
# after 50% of the 300 monthly credits burned by the 5th; even main-only
# builds, one per merge across parallel sessions, were the drain). The ignore
# command returns exit 0 UNCONDITIONALLY → every build is SKIPPED, so Netlify
# consumes no credits. The LAST successful deploy stays live, so the 301
# redirect below KEEPS funneling the mirror's visitors to the real Vercel app
# — we lose nothing by never rebuilding. Netlify semantics: ignore-command
# exit 0 = SKIP the build, non-zero = build. For a HARD kill (also stops the
# redirect), stop/lock builds or delete the site in the Netlify dashboard —
# that needs the UI, not this file.
[build]
  ignore = "exit 0"
  command = "npx vite build"
  publish = "dist"

# 🔒 THE MIRROR IS RETIRED — every visitor goes to the REAL app (David
# 2026-08-06: 14 people were using this stale copy; it has none of the Vercel
# API functions, so no coach voice, no explorer, and gates that depend on
# those APIs can misbehave. One funnel, one paywall, one prod). FIRST redirect
# wins in Netlify; force=true overrides any file match including the SPA
# fallback below.
[[redirects]]
  from = "/*"
  to = "https://chess-academy-pro.vercel.app/:splat"
  status = 301
  force = true

# Proxy voice pack downloads from GitHub Releases (avoids CORS + keeps same domain)
[[redirects]]
  from = "/voice-packs/*"
  to = "https://github.com/dyahnke-pro/chess-academy-pro/releases/download/voice-packs-v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
