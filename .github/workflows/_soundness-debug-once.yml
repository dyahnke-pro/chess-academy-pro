name: _soundness-debug-once (temporary)

# TEMPORARY debug helper (delete after reading the output). Runs the
# Italian-scoped masters-legitimacy + soundness audit on a runner (live
# explorer + Stockfish — unreachable in the sandbox) and commits the full
# output back so the exact remaining flags can be read. Path-filtered to
# its own file.

on:
  push:
    branches:
      - claude/italian-game-masterclass-umuFc
    paths:
      - '.github/workflows/_soundness-debug-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Run Italian soundness audit (capture output)
        env:
          RUN_MASTERS_AUDIT: '1'
          STOCKFISH_PATH: /usr/games/stockfish
        run: |
          set +e
          echo "HEAD=$(git rev-parse --short HEAD)" > soundness-debug.txt
          npx vitest run src/data/lessons/mastersCoverage.test.ts -t "italian-game" >> soundness-debug.txt 2>&1
          echo "VITEST_EXIT=$?" >> soundness-debug.txt
          echo "=== FILTERED (failures only) ===" >> soundness-debug.txt
          grep -nE "✓ italian|× italian|FAIL|AssertionError|did not play|loses [0-9]+cp|unsound|Tests " soundness-debug.txt >> soundness-debug.txt || true
      - name: Commit debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f soundness-debug.txt
          git commit -m "debug: Italian soundness audit @ HEAD (temporary)" || true
          git push
