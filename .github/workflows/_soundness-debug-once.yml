name: _soundness-debug-once (temporary)

# TEMPORARY debug helper (delete after reading). Scope "talian" covers BOTH
# the main lesson ("The Italian Game — A Master Class") AND the variation/plan
# tests ("italian-game::…") — the earlier "italian-game" scope MISSED the main
# lesson's 6a/6b. Runs on a runner (live explorer + Stockfish) and commits the
# full output back.

on:
  push:
    branches:
      - claude/italian-game-masterclass-umuFc
    paths:
      - '.github/workflows/_soundness-debug-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Run full Italian soundness audit (main + variations + plans)
        env:
          RUN_MASTERS_AUDIT: '1'
          STOCKFISH_PATH: /usr/games/stockfish
        run: |
          set +e
          echo "HEAD=$(git rev-parse --short HEAD)" > soundness-debug.txt
          npx vitest run src/data/lessons/mastersCoverage.test.ts -t "talian" >> soundness-debug.txt 2>&1
          echo "VITEST_EXIT=$?" >> soundness-debug.txt
          echo "=== FAILURES ===" >> soundness-debug.txt
          grep -nE "× |FAIL|AssertionError|did not play|loses [0-9]+cp|unsound|master-divergent|Tests " soundness-debug.txt >> soundness-debug.txt || true
      - name: Commit debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f soundness-debug.txt
          git commit -m "debug: full Italian soundness @ HEAD (main+variations+plans)" || true
          git push
