name: iOS → TestFlight

# Build the Capacitor app on a macOS runner and upload to TestFlight — so a
# new TestFlight build is one workflow trigger, no local Xcode archive.
#
# Trigger: manual (workflow_dispatch) or a push that changes fastlane/ or this
# workflow. Requires the secrets in docs/ios-testflight-ci.md.
#
# Key formats: APP_STORE_CONNECT_API_KEY = ORIGINAL Apple .p8 (PKCS#8) base64.
# altool uses it verbatim; spaceship needs SEC1, derived in the build step.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'What changed since the last TestFlight build (for the log).'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'fastlane/**'
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # macos-26 ships Xcode 26 (iOS 26 SDK). Apple rejects uploads built with
    # the iOS 18.5 SDK (Xcode 16, the macos-15 default) — "all apps must be
    # built with the iOS 26 SDK or later." macos-15 can no longer ship to ASC.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Add + sync iOS project (regenerates the gitignored ios/)
        run: |
          # ios/App/ci_scripts/ is committed (Xcode Cloud needs it), so ios/
          # EXISTS at checkout and `npx cap add ios` aborts with "ios platform
          # already exists" — which has failed every TestFlight build since the
          # ci_scripts commit (2026-06-13). This GitHub-Actions path signs via
          # fastlane and does NOT use ci_post_clone, so regenerate ios/ clean:
          # the rm only touches the runner's checkout, never the committed file.
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      # MUST run AFTER `cap add ios` — capacitor-assets writes into the iOS
      # project's asset catalog, and if the project doesn't exist yet it
      # silently skips iOS ("iOS platform not found") and the default Capacitor
      # placeholder icon ships. (This step used to run before `cap add`, which
      # is exactly how the placeholder icon reached TestFlight — David
      # 2026-06-14.) The verify step fails the build if the brand icon didn't
      # actually land.
      - name: Generate app icons / splash
        run: npm run assets:generate

      - name: Verify the brand app icon was applied
        run: node scripts/verify-app-icon.mjs

      - name: Apply AVAudioSession AppDelegate patch
        run: cp ios-patches/App/AppDelegate.swift ios/App/App/AppDelegate.swift

      - name: Prepare ASC keys (PKCS#8 for altool, SEC1 for spaceship)
        env:
          ASC_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -x
          printf '%s' "$ASC_KEY_P8_B64" | base64 -d > "$RUNNER_TEMP/asc.p8"
          echo "p8 head: $(head -1 "$RUNNER_TEMP/asc.p8"); bytes: $(wc -c < "$RUNNER_TEMP/asc.p8")"
          # SEC1 for fastlane spaceship.
          openssl ec -in "$RUNNER_TEMP/asc.p8" -out "$RUNNER_TEMP/asc_sec1.pem"
          echo "sec1 head: $(head -1 "$RUNNER_TEMP/asc_sec1.pem")"
          # Place the ORIGINAL .p8 (verbatim) where altool searches.
          for d in "$HOME/.appstoreconnect/private_keys" "$HOME/private_keys" "$HOME/.private_keys" "./private_keys"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/asc.p8" "$d/AuthKey_${KEY_ID}.p8"
          done

      - name: Fastlane → build signed IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          CERT_P12_B64: ${{ secrets.BUILD_CERT_P12_B64 }}
          CERT_P12_PASSWORD: 'capro-ci-2026'
        run: |
          # macOS `base64` is BSD, not GNU — it has no `-w` flag, so the old
          # `base64 -w0` errored and left this var EMPTY, which fastlane read as
          # an empty key → "invalid curve name". `openssl base64 -A` is portable
          # and emits a single unwrapped line on both Linux and macOS.
          export APP_STORE_CONNECT_API_KEY_B64="$(openssl base64 -A -in "$RUNNER_TEMP/asc_sec1.pem")"
          printf '%s' "$CERT_P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          export CERT_P12_PATH="$RUNNER_TEMP/dist.p12"
          bundle exec fastlane ios beta

      - name: Upload to TestFlight (altool, original .p8)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          echo "Uploading build/App.ipa to TestFlight via altool…"
          xcrun altool --upload-app --type ios --file build/App.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/*.ipa
          if-no-files-found: ignore
