name: iOS → TestFlight

# Build the Capacitor app on a macOS runner and upload to TestFlight — so a
# new TestFlight build is one workflow trigger, no local Xcode archive.
#
# Trigger: manual (workflow_dispatch) or a push that changes fastlane/ or this
# workflow. Requires the secrets in docs/ios-testflight-ci.md.
#
# Key-format note: fastlane spaceship parses SEC1 EC keys (its EC.new chokes on
# PKCS#8); Apple's altool uploader requires PKCS#8. So the BUILD uses the SEC1
# secret, and the UPLOAD step converts it to PKCS#8 for altool — one format per
# tool, no conflict.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'What changed since the last TestFlight build (for the log).'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'fastlane/**'
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # macos-15 ships Xcode 16 as default (Apple requires the iOS 18 / Xcode 16
    # SDK for App Store + TestFlight uploads). No explicit xcode-select needed.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Generate app icons / splash
        run: npm run assets:generate

      - name: Add + sync iOS project (regenerates the gitignored ios/)
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Apply AVAudioSession AppDelegate patch
        run: cp ios-patches/App/AppDelegate.swift ios/App/App/AppDelegate.swift

      - name: Fastlane → build signed IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          # SEC1 key (the secret) directly — spaceship parses SEC1 cleanly.
          APP_STORE_CONNECT_API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          # base64 of the persistent distribution .p12 (cert + private key).
          CERT_P12_B64: ${{ secrets.BUILD_CERT_P12_B64 }}
          CERT_P12_PASSWORD: 'capro-ci-2026'
        run: |
          printf '%s' "$CERT_P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          export CERT_P12_PATH="$RUNNER_TEMP/dist.p12"
          bundle exec fastlane ios beta

      - name: Upload to TestFlight (altool, PKCS#8 key)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          # Secret holds SEC1; altool needs PKCS#8 — convert and place it where
          # altool looks (~/.appstoreconnect/private_keys/AuthKey_<KEYID>.p8).
          ASC_KEY_SEC1_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_SEC1_B64" | base64 -d | openssl pkey > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "Uploading build/App.ipa to TestFlight via altool…"
          xcrun altool --upload-app --type ios --file build/App.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/*.ipa
          if-no-files-found: ignore
