name: iOS → TestFlight

# Build the Capacitor app on a macOS runner and upload to TestFlight — so a
# new TestFlight build is one workflow trigger, no local Xcode archive.
#
# Trigger: manual (workflow_dispatch). NOT on every push — TestFlight builds
# are deliberate, and external testers need Apple Beta App Review anyway.
#
# Requires the secrets documented in docs/ios-testflight-ci.md. Without them
# the `fastlane beta` step fails fast at the first missing ENV.fetch — nothing
# else in the repo is affected.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'What changed since the last TestFlight build (for the log).'
        required: false
        type: string
  # Build whenever the iOS build config changes on main (the git proxy here
  # blocks tag pushes, and the dispatch API needs a token we don't have, so a
  # path-scoped push trigger is the reliable kick). Normal app/code pushes to
  # main do NOT build — only edits to fastlane/ or this workflow.
  push:
    branches: [main]
    paths:
      - 'fastlane/**'
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # macos-15 ships Xcode 16 as default (Apple requires the iOS 18 / Xcode 16
    # SDK for App Store + TestFlight uploads). No explicit xcode-select needed.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Generate app icons / splash
        run: npm run assets:generate

      - name: Add + sync iOS project (regenerates the gitignored ios/)
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Apply AVAudioSession AppDelegate patch
        run: cp ios-patches/App/AppDelegate.swift ios/App/App/AppDelegate.swift

      - name: Fastlane → TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          # base64 of the SEC1 EC key (pre-validated against the ASC API).
          APP_STORE_CONNECT_API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          # base64 of the persistent distribution .p12 (cert + private key).
          CERT_P12_B64: ${{ secrets.BUILD_CERT_P12_B64 }}
          CERT_P12_PASSWORD: 'capro-ci-2026'
        run: |
          printf '%s' "$CERT_P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          export CERT_P12_PATH="$RUNNER_TEMP/dist.p12"
          bundle exec fastlane ios beta

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/*.ipa
          if-no-files-found: ignore
