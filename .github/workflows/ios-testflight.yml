name: iOS → TestFlight

# Build the Capacitor app on a macOS runner and upload to TestFlight — so a
# new TestFlight build is one workflow trigger, no local Xcode archive.
#
# Trigger: manual (workflow_dispatch). NOT on every push — TestFlight builds
# are deliberate, and external testers need Apple Beta App Review anyway.
#
# Requires the secrets documented in docs/ios-testflight-ci.md. Without them
# the `fastlane beta` step fails fast at the first missing ENV.fetch — nothing
# else in the repo is affected.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'What changed since the last TestFlight build (for the log).'
        required: false
        type: string
  # Build whenever the iOS build config changes on main (the git proxy here
  # blocks tag pushes, and the dispatch API needs a token we don't have, so a
  # path-scoped push trigger is the reliable kick). Normal app/code pushes to
  # main do NOT build — only edits to fastlane/ or this workflow.
  push:
    branches: [main]
    paths:
      - 'fastlane/**'
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # macos-15 ships Xcode 16 as default (Apple requires the iOS 18 / Xcode 16
    # SDK for App Store + TestFlight uploads). No explicit xcode-select needed.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Generate app icons / splash
        run: npm run assets:generate

      - name: Add + sync iOS project (regenerates the gitignored ios/)
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Apply AVAudioSession AppDelegate patch
        run: cp ios-patches/App/AppDelegate.swift ios/App/App/AppDelegate.swift

      - name: Patch spaceship to read PKCS#8 EC keys
        # fastlane spaceship parses the ASC key with OpenSSL::PKey::EC.new,
        # which on OpenSSL 3 can't read a PKCS#8 EC key (→ "invalid curve
        # name"). OpenSSL::PKey.read handles BOTH PKCS#8 and SEC1, so this
        # one-line swap lets us use the original PKCS#8 .p8 — which altool's
        # TestFlight upload also requires. One key format for the whole lane.
        run: |
          TOKEN_RB=$(find vendor/bundle -path '*spaceship*/connect_api/token.rb' | head -1)
          if [ -z "$TOKEN_RB" ]; then echo "::error::spaceship token.rb not found"; exit 1; fi
          sed -i.bak 's/OpenSSL::PKey::EC\.new/OpenSSL::PKey.read/g' "$TOKEN_RB"
          echo "patched $TOKEN_RB:"; grep -n 'OpenSSL::PKey' "$TOKEN_RB"

      - name: Fastlane → TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          # Secret holds base64 of the SEC1 key. We convert it BACK to PKCS#8
          # (the original .p8 form): the patched spaceship reads PKCS#8, and
          # altool's TestFlight upload REQUIRES PKCS#8 (it rejects SEC1 with
          # "AuthKey file does not contain a valid key"). One format for both.
          ASC_KEY_SEC1_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          # base64 of the persistent distribution .p12 (cert + private key).
          CERT_P12_B64: ${{ secrets.BUILD_CERT_P12_B64 }}
          CERT_P12_PASSWORD: 'capro-ci-2026'
        run: |
          printf '%s' "$ASC_KEY_SEC1_B64" | base64 -d > "$RUNNER_TEMP/asc_sec1.pem"
          openssl pkey -in "$RUNNER_TEMP/asc_sec1.pem" -out "$RUNNER_TEMP/asc_pkcs8.pem"
          export APP_STORE_CONNECT_API_KEY_B64="$(base64 -w0 "$RUNNER_TEMP/asc_pkcs8.pem")"
          printf '%s' "$CERT_P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          export CERT_P12_PATH="$RUNNER_TEMP/dist.p12"
          bundle exec fastlane ios beta

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/*.ipa
          if-no-files-found: ignore
