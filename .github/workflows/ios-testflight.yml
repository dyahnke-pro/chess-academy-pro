name: iOS → TestFlight

# Build the Capacitor app on a macOS runner and upload to TestFlight — so a
# new TestFlight build is one workflow trigger, no local Xcode archive.
#
# Trigger: manual (workflow_dispatch) or a push that changes fastlane/ or this
# workflow. Requires the secrets in docs/ios-testflight-ci.md.
#
# Key formats: the APP_STORE_CONNECT_API_KEY secret holds the ORIGINAL Apple
# .p8 (PKCS#8) base64. altool's TestFlight upload uses it verbatim (it needs
# Apple's exact bytes). fastlane spaceship can't parse PKCS#8 (its EC.new →
# "invalid curve name"), so the build step derives a SEC1 form from it.
#
# (re-trigger: original-.p8 secret)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'What changed since the last TestFlight build (for the log).'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'fastlane/**'
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # macos-15 ships Xcode 16 as default (Apple requires the iOS 18 / Xcode 16
    # SDK for App Store + TestFlight uploads). No explicit xcode-select needed.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Generate app icons / splash
        run: npm run assets:generate

      - name: Add + sync iOS project (regenerates the gitignored ios/)
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Apply AVAudioSession AppDelegate patch
        run: cp ios-patches/App/AppDelegate.swift ios/App/App/AppDelegate.swift

      - name: Fastlane → build signed IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          # Secret = original PKCS#8 .p8 (base64). spaceship needs SEC1 → derive
          # it (openssl ec reads PKCS#8 or SEC1 and emits SEC1).
          ASC_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          CERT_P12_B64: ${{ secrets.BUILD_CERT_P12_B64 }}
          CERT_P12_PASSWORD: 'capro-ci-2026'
        run: |
          printf '%s' "$ASC_KEY_P8_B64" | base64 -d | openssl ec -outform pem > "$RUNNER_TEMP/asc_sec1.pem" 2>/dev/null
          export APP_STORE_CONNECT_API_KEY_B64="$(base64 -w0 "$RUNNER_TEMP/asc_sec1.pem")"
          printf '%s' "$CERT_P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          export CERT_P12_PATH="$RUNNER_TEMP/dist.p12"
          bundle exec fastlane ios beta

      - name: Upload to TestFlight (altool, original .p8)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          # The secret is Apple's original PKCS#8 .p8 — give altool those exact
          # bytes (a re-serialized PKCS#8 makes altool's JWT loader fall back to
          # no-auth → -26000). Placed in every dir altool searches.
          ASC_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          for d in "$HOME/.appstoreconnect/private_keys" "$HOME/private_keys" "$HOME/.private_keys" "./private_keys"; do
            mkdir -p "$d"
            printf '%s' "$ASC_KEY_P8_B64" | base64 -d > "$d/AuthKey_${KEY_ID}.p8"
          done
          echo "Uploading build/App.ipa to TestFlight via altool…"
          xcrun altool --upload-app --type ios --file build/App.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/*.ipa
          if-no-files-found: ignore
