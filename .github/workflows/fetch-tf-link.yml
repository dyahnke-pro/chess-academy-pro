name: Fetch TestFlight public link (one-off)

# Runs on push of this file to the forum-promo feature branch, and on manual
# dispatch. Read-only ASC query — prints the public TestFlight link to the log.
# Does NOT touch main, so no Vercel build.
on:
  push:
    branches: [claude/chess-app-forum-promo-bymis4]
    paths: ['.github/workflows/fetch-tf-link.yml', 'scripts/ci/print-testflight-link.mjs']
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Query App Store Connect for the public link
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: node scripts/ci/print-testflight-link.mjs
