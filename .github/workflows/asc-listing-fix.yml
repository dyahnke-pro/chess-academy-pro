name: ASC listing fix (subscription + EULA links)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Set to "1" to PATCH the live description (otherwise dry-run)'
        required: false
        default: ''

jobs:
  listing-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Description fix (3.1.2 + 2.3.2)
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_BUNDLE_ID: com.chessacademy.pro
          APP_VERSION: '3.4'
          APPLY: ${{ github.event.inputs.apply }}
          KEYWORDS: 'openings,coach,tactics,puzzles,trainer,training,strategy,endgame,lessons,analysis,gambit,learn,study'
        run: node scripts/ci/asc-listing-fix.mjs
