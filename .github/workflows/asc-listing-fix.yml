name: ASC listing fix (subscription + EULA links)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Set to "1" to PATCH the live description (otherwise dry-run)'
        required: false
        default: ''
      subtitle:
        description: 'App Store subtitle (<=30 chars). Leave blank to only REPORT the current one.'
        required: false
        # The field was EMPTY (0/30) until 2026-09-03. Defaulted so a run with
        # apply=1 sets it rather than silently leaving a third of the indexed
        # surface blank again.
        default: 'Opening Trainer & Game Review'

jobs:
  listing-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Description fix (3.1.2 + 2.3.2)
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_BUNDLE_ID: com.chessacademy.pro
          APP_VERSION: '4.0.1'
          APPLY: ${{ github.event.inputs.apply }}
          # Finalized 2026-09-03 — see docs/store-listing-copy.md for the
          # rationale. Drops `coach` (already in the app NAME) and
          # `trainer`/`training` (now carried by the subtitle), which were ~30
          # characters buying nothing, and spends them on stockfish/checkmate/
          # analysis, which appeared in no field before.
          KEYWORDS: 'tactics,puzzles,endgame,strategy,lessons,analysis,gambit,learn,study,stockfish,checkmate,openings'
          SUBTITLE: ${{ github.event.inputs.subtitle }}
        run: node scripts/ci/asc-listing-fix.mjs
