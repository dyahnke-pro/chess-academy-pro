name: ASC submit for review

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scaffold the submission but do NOT flip submitted=true'
        required: false
        default: 'false'
      diagnose:
        description: 'Read-only: list existing reviewSubmissions + items, no writes'
        required: false
        default: 'false'

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Submit for review
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_BUNDLE_ID: com.chessacademy.pro
          APP_VERSION: '3.8'
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          DIAGNOSE: ${{ github.event.inputs.diagnose == 'true' && '1' || '0' }}
        run: node scripts/ci/asc-submit-review.mjs
