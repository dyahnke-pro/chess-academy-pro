name: _mine-italian-once (temporary)

# TEMPORARY, self-cleaning helper (delete after the Italian gems land).
# The web sandbox can't reach the amateur Lichess explorer (the gem source) —
# it's firewall-blocked there. GitHub Actions runners have open network, so
# this job runs the SAME miner against the live amateur explorer with a real
# Stockfish, then commits the refreshed punish-gems.json back to the Italian
# masterclass branch. Path-filtered to its own file so it only fires when this
# workflow is pushed (never re-triggered by the gems commit it makes).

on:
  push:
    branches:
      - claude/italian-game-masterclass-umuFc
    paths:
      - '.github/workflows/_mine-italian-once.yml'

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
      - name: Mine Italian punish-gems (live amateur explorer + engine)
        env:
          STOCKFISH_PATH: /usr/games/stockfish
          OPENINGS: italian-game
        run: node scripts/mine-punish-gems.mjs
      - name: Show mined gems
        run: node -e "const g=require('./src/data/punish-gems.json');const it=g.filter(x=>x.openingId==='italian-game');console.log('italian gems:',it.length);for(const x of it)console.log(' ',x.lineMoves,'|',x.inaccuracy,'->',x.punish,'['+x.tier,x.engineCp+'cp]');"
      - name: Commit gems back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/punish-gems.json
          git diff --cached --quiet || git commit -m "chore(gems): mine Italian punish-gems on CI (engine-confirmed)"
          git push
