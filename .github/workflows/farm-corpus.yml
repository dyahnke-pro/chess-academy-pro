name: Farm teaching corpus (CI runners)

# WHY THIS EXISTS (2026-08-01). The transcript pull runs from whatever machine
# starts it, and YouTube bot-checks that IP after a few hundred fetches: the
# Saint Louis farm sat at 371/1715 for hours, every request failing, the
# circuit breaker burning 30-minute cooldowns for zero throughput. Retrying
# from the same address cannot fix a block on that address.
#
# GitHub runners are fresh IPs, so the pull simply works there. The whole
# pipeline runs on the runner and commits ONLY the shipped corpus:
#   pull (yt-dlp) → distill-v2 (DeepSeek) → merge-corpus → public/data/*.json
#
# PLAGIARISM GUARD INTACT (CLAUDE.md, David 2026-07-02): raw transcripts live
# and die on the runner. They are never uploaded, never artifacted, never
# committed — they exist only so the distiller can read WHICH established idea
# is taught at each move. Shipped prose is original.
#
# The DeepSeek key is pulled from Vercel at run time with the runner's
# VERCEL_TOKEN, per the standing rule that server credentials live in Vercel
# and are never committed or duplicated into GitHub secrets.

on:
  workflow_dispatch:
    inputs:
      creator:
        description: 'Creator key (saintlouis | hangingpawns | chessbrah)'
        required: true
        default: 'saintlouis'
      pull_limit:
        description: 'Max transcripts to pull this run'
        required: false
        default: '400'
  schedule:
    # Every 2h. The backlog is finite (~1,300 Saint Louis transcripts at 400 a
    # run), and David wants it farming CONSTANTLY until it is done rather than
    # trickling. A healthy run finishes in well under an hour, so a 2h cadence
    # keeps a runner working almost continuously without ever overlapping.
    - cron: '0 */2 * * *'

concurrency:
  # Never let two runs fight over the same corpus file.
  group: farm-corpus-${{ github.event.inputs.creator || 'saintlouis' }}
  cancel-in-progress: false

# The default GITHUB_TOKEN is read-only, so the final step 403'd:
# "Permission to dyahnke-pro/chess-academy-pro.git denied to github-actions[bot]".
# Every earlier step succeeded — the transcripts pulled fine on the fresh runner
# IP, the corpus merged, the gate passed — and then the whole run failed on the
# push, throwing the work away. The farm's entire purpose is committing that
# corpus, so it needs write.
permissions:
  contents: write

jobs:
  farm:
    runs-on: ubuntu-latest
    # 90, not 330. Run 4 hung and sat in_progress for 3.7 HOURS holding the
    # concurrency group, so every scheduled run behind it was blocked from even
    # starting — one stall silently froze the whole farm. A healthy run pulls in
    # ~32 min and finishes well inside this, so a job still alive at 90 minutes
    # is stuck, and killing it frees the queue for the next cron instead of
    # letting it idle until the 5.5h ceiling.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      - name: Install yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip
          pip3 install --quiet --upgrade yt-dlp
          yt-dlp --version

      - name: Resolve the DeepSeek key from Vercel
        id: key
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — pulling transcripts only, no distill."
            echo "have_key=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          P=prj_qYJMwF1apaxdp6sIZzcvZMz9BcZN; T=team_EG9m215w9cQHWilBOPnOtIFS
          ID=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$P/env?teamId=$T" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const e=JSON.parse(s).envs.find(e=>e.key==='DEEPSEEK_KEY');console.log(e?e.id:'')})")
          VAL=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/projects/$P/env/$ID?teamId=$T&decrypt=true" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).value||'')})")
          if [ -z "$VAL" ]; then
            echo "::warning::could not resolve DEEPSEEK_KEY — pulling only."
            echo "have_key=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::add-mask::$VAL"
          echo "DEEPSEEK_KEY=$VAL" >> "$GITHUB_ENV"
          echo "have_key=1" >> "$GITHUB_OUTPUT"

      # A pull that never ENDS ships nothing: the distiller only reads the
      # transcripts once this step exits, so runs 1-4 on 2026-08-01 pulled for
      # 3.7, 5.5, 2.0 and 0.6 hours and committed ZERO notes between them —
      # every one either got cancelled or timed out mid-pull and threw the
      # whole download away. The script now stops on its own clock and hands
      # over what it has; these two settings make that guarantee survive a
      # genuinely hung yt-dlp:
      #   • timeout-minutes — a hard backstop if the process wedges past its
      #     own budget check (which only runs between fetches).
      #   • continue-on-error — a killed or failed pull must NOT skip distill /
      #     merge / commit. Whatever landed on disk is real work and ships.
      - name: Pull transcripts (fresh runner IP)
        continue-on-error: true
        timeout-minutes: 45
        env:
          PULL_PACE_MS: '2500'
        run: |
          # 4 workers, not 1. Sequential costs ~60s per transcript, so a 40
          # minute budget bought about 40 of them and the backlog would outlive
          # the year. 14 workers got the IP rate-limited within 15 minutes
          # (measured 2026-08-02) and every worker fell into a 30-minute
          # cooldown; 4-6 ran clean. Stay at the low end here — a runner IP that
          # gets bot-checked poisons the one advantage CI has over local.
          node scripts/danya-corpus/pull-transcripts.mjs \
            --creator "${{ github.event.inputs.creator || 'saintlouis' }}" \
            --limit "${{ github.event.inputs.pull_limit || '400' }}" \
            --concurrency 4 \
            --budget-minutes 40

      - name: Distill
        if: steps.key.outputs.have_key == '1'
        run: |
          node scripts/danya-corpus/distill-v2.mjs \
            --creator "${{ github.event.inputs.creator || 'saintlouis' }}" --concurrency 4

      - name: Merge into the shipped corpus
        if: steps.key.outputs.have_key == '1'
        run: |
          node scripts/danya-corpus/merge-corpus.mjs \
            --creator "${{ github.event.inputs.creator || 'saintlouis' }}"

      - name: Gate the corpus before it can ship
        if: steps.key.outputs.have_key == '1'
        run: npx vitest run src/data/secondaryTeachings.test.ts

      - name: Commit the corpus (never the transcripts)
        if: steps.key.outputs.have_key == '1'
        run: |
          git config user.email noreply@anthropic.com
          git config user.name Claude
          # ONLY the shipped JSON. data/sources/** is gitignored and stays that
          # way — the raw transcripts must never enter the repo.
          git add public/data/*-teachings.json src/data/*-teachings.json 2>/dev/null || true
          # NOTES are the deliverable, not bytes. Run 7 went fully green and
          # committed "7199 notes" for the second time running: merge rewrote the
          # file (timestamp, ordering) so `git diff --cached` saw a change and the
          # no-op guard below never fired. Compare what the corpus actually holds
          # against what it held at HEAD.
          NOW=$(node -e "
            const f='public/data/${{ github.event.inputs.creator || 'saintlouis' }}-teachings.json';
            try { console.log(JSON.parse(require('fs').readFileSync(f,'utf8')).notes.length) } catch { console.log(0) }")
          WAS=$(git show HEAD:public/data/${{ github.event.inputs.creator || 'saintlouis' }}-teachings.json 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).notes.length)}catch{console.log(0)}})")
          echo "notes: ${WAS} -> ${NOW}"
          # A run that ships NOTHING must be RED. Four runs on 2026-08-01 burned
          # 11 hours between them and committed zero notes, and nobody noticed
          # because a no-op exits 0 and reads as a healthy green run — the exact
          # failure mode CLAUDE.md warns about (a silent no-op reporting success
          # is worse than a crash). The farm's whole job is landing a chunk, so
          # not landing one is a failure, not a quiet skip.
          if [ "$NOW" -le "$WAS" ]; then
            LEFT=$(node -e "
              try { console.log(JSON.parse(require('fs').readFileSync('.pull-status.json','utf8')).missingAtStart) }
              catch { console.log('unknown') }")
            if [ "$LEFT" = "0" ]; then
              echo "::notice::nothing left to farm for this creator — backlog is empty"
              exit 0
            fi
            # ── SAY WHICH STAGE PRODUCED NOTHING ────────────────────────────
            #
            # 🔒 "the pull or distill produced nothing" names two stages with
            # completely different owners and gives no way to tell them apart,
            # so this job sat red and undiagnosed. `.pull-status.json` already
            # records `done` and `failed` per run — the guard just never read
            # them.
            #
            # Measured 2026-08-12: the merge logged `0 videos → 36530 notes`.
            # ZERO transcripts reached the distiller, so nothing downstream had
            # any input. yt-dlp pulls those same videos fine from a residential
            # path (verified this session), which makes it YouTube refusing the
            # runner's datacenter IP — an upstream block with no code fix, and
            # emphatically not the distiller being broken.
            #
            # Still RED either way: a farm that ships nothing has failed at its
            # one job. But it now says which half to go and look at.
            PULLED=$(node -e "
              try { console.log(JSON.parse(require('fs').readFileSync('.pull-status.json','utf8')).done) }
              catch { console.log('unknown') }")
            FAILED=$(node -e "
              try { console.log(JSON.parse(require('fs').readFileSync('.pull-status.json','utf8')).failed) }
              catch { console.log('unknown') }")
            if [ "$PULLED" = "0" ]; then
              echo "::error::farm added no notes because it pulled NO TRANSCRIPTS (0 of ${LEFT} wanted, ${FAILED} failed). The distiller never had input. yt-dlp works from a residential path, so this is YouTube blocking the runner's IP — re-run the farm from a session environment; there is no code fix here."
            else
              echo "::error::farm pulled ${PULLED} transcript(s) but added no notes (${WAS} -> ${NOW}) — the DISTILL produced nothing. This one is ours."
            fi
            exit 1
          fi
          git commit -m "feat(corpus): farm ${{ github.event.inputs.creator || 'saintlouis' }} — ${NOW} notes (+$((NOW-WAS)))"
          git pull --rebase origin main
          git push origin HEAD:main
