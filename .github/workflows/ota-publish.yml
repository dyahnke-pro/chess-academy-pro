name: Publish OTA bundle

# Ships the web bundle to native users on every main push.
#
# WHY THIS EXISTS (2026-09-03): the OTA pointer could only advance inside
# `daily-deploy.yml`, which runs once a day AND behind two gates. Every other
# push to main deployed the web via Vercel's git integration and published no
# bundle at all — so the pointer routinely sat weeks behind main while the app
# looked like it was shipping. Combined with the missing forward-only guard,
# that is how devices were served an Aug-5 bundle on Aug 31.
#
# Its own concurrency group, deliberately NOT shared with post-deploy-audit:
# a shared group cancels in-flight runs (CLAUDE.md records a 73-minute loop
# audit killed exactly that way). cancel-in-progress is false so a queued
# publish is never dropped; if two land out of order the publisher's
# forward-only guard rejects the older one, which is the correct outcome.
#
# The publish itself is safe to repeat: file blobs are content-addressed, and
# the pointer is written last.

on:
  push:
    branches: [main]
    # Nothing here can change the shipped bundle, and publishing one that is
    # byte-identical except for its version string is not free: every device is
    # then offered an update and re-downloads the changed chunks (~8 MB) for a
    # change that cannot affect what they run. `dist/` comes from vite, so only
    # src/, public/, index.html and the build config feed it — server functions
    # under api/, the CI scripts, and the native project do not.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'
      - 'ios-patches/**'
      - 'ios/**'
      - 'scripts/**'
      - 'api/**'
      - 'e2e/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the forward-only guard (deliberate rollback)'
        required: false
        default: 'false'

concurrency:
  group: ota-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The publisher reads the commit timestamp for the monotonic ordinal.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build + publish
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OTA_PUBLISH_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          # 🔒 NATIVE-ONLY BUILD FLAGS. The OTA bundle replaces the web root on a
          # NATIVE device, so it must be built with the NATIVE environment — not
          # the web one. Both are absent from Vercel deliberately: the web app is
          # free and unwalled on purpose (VITE_PAYWALL_ENABLED there would wall
          # the beta testers), and the RevenueCat key has never been on Vercel at
          # all. Building from the web env therefore handed native devices a
          # bundle with the paywall OFF and billing DEAD — no purchase, no
          # restore, no subscription recognised — from the first OTA that landed
          # (2026-07-28) until this change.
          #
          # Confirmed rather than assumed: 9 native devices have fired
          # `free_opening_claimed`, which only happens when the gate is live, so
          # VITE_PAYWALL_ENABLED really is true on the store build.
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          VITE_PAYWALL_ENABLED: 'true'
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN not set — cannot read the project env."
            exit 1
          fi
          npm ci
          npm install -g vercel@latest

          # 🚨 THE BUNDLE'S VITE_* VALUES ARE BAKED AT BUILD TIME — get them right.
          # `vercel pull` fetches the project env (PostHog write key, provider
          # keys, and the publisher's own Blob + KV credentials). A bare
          # `npm run build` without it ships analytics dead and the coach with no
          # provider key.
          #
          # But `vercel build --prod` is ALSO wrong here, and that was the defect:
          # it consumes the WEB env, which deliberately has no paywall flag and no
          # RevenueCat key, and then overwrites the native values below. So: pull
          # the env, source it, let the native flags win, and build directly.
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

          # A WRONG key is worse than none — hard fail.
          # An sk_ key is RevenueCat's SECRET server key. vite inlines VITE_* into
          # the client bundle, and that bundle is published to a PUBLIC blob URL,
          # cached immutable. Substituting it would publish the secret.
          case "${VITE_REVENUECAT_IOS_KEY:-}" in
            ''|appl_*) ;;
            *)
              echo "::error::VITE_REVENUECAT_IOS_KEY must be the PUBLIC appl_ SDK key."
              echo "  A non-appl_ value (e.g. the sk_ server key on Vercel) would be"
              echo "  inlined into a bundle published at a PUBLIC URL. Refusing."
              exit 1
              ;;
          esac

          # A MISSING key is loud, but must NOT block the publish. The bundle
          # already live has no key either, so refusing to publish would stop
          # crash fixes reaching users without fixing billing for anyone — a
          # strictly worse trade. Ship the fixes, make the gap impossible to miss,
          # and let the on-device detector (billingUnconfiguredNative) measure it.
          if [ -z "${VITE_REVENUECAT_IOS_KEY:-}" ]; then
            echo "::error::No VITE_REVENUECAT_IOS_KEY secret — this bundle ships with billing DEAD on native (no purchase, no restore, no subscription). Add the PUBLIC appl_ key from RevenueCat -> Project Settings -> API Keys -> Apple App Store as a repository secret."
            echo "## ⚠️ OTA published WITHOUT a RevenueCat key — billing is dead on every native device that applies it" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ OTA built with the native RevenueCat key — billing intact" >> "$GITHUB_STEP_SUMMARY"
          fi

          # `vercel build` consumes the PULLED web env and would overwrite the two
          # flags above, which is the whole defect. Build directly instead: source
          # the pulled env first (VITE_POSTHOG_*, Blob + KV creds), then let the
          # native flags win.
          set -a
          [ -f .vercel/.env.production.local ] && . .vercel/.env.production.local
          set +a
          export VITE_REVENUECAT_IOS_KEY VITE_PAYWALL_ENABLED
          npm run build

          # The publisher's credentials (BLOB_READ_WRITE_TOKEN + Upstash KV) came
          # from the same pulled env, sourced above.
          test -d dist || { echo "::error::the build produced no dist/"; exit 1; }
          node scripts/ci/publish-ota-bundle.mjs "$(git rev-parse --short=8 HEAD)"

      # Post-check, deliberately NON-FATAL: several of its assertions read the
      # LIVE /api/ota/manifest endpoint, which Vercel's git integration deploys
      # on its own schedule — so right after a publish it may still be serving
      # the previous endpoint build and fail for a reason unrelated to this
      # publish. Loud, not red: a job that goes red on every run gets ignored,
      # and an ignored check is the same as no check.
      - name: Verify the published bundle serves correctly
        continue-on-error: true
        run: |
          node scripts/audit-ota.mjs || echo "::warning::audit-ota reported failures — see the log. If they are endpoint-contract checks, re-run once the web deploy for this commit is live."
