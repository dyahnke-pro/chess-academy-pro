name: Publish OTA bundle

# Ships the web bundle to native users on every main push.
#
# WHY THIS EXISTS (2026-09-03): the OTA pointer could only advance inside
# `daily-deploy.yml`, which runs once a day AND behind two gates. Every other
# push to main deployed the web via Vercel's git integration and published no
# bundle at all — so the pointer routinely sat weeks behind main while the app
# looked like it was shipping. Combined with the missing forward-only guard,
# that is how devices were served an Aug-5 bundle on Aug 31.
#
# Its own concurrency group, deliberately NOT shared with post-deploy-audit:
# a shared group cancels in-flight runs (CLAUDE.md records a 73-minute loop
# audit killed exactly that way). cancel-in-progress is false so a queued
# publish is never dropped; if two land out of order the publisher's
# forward-only guard rejects the older one, which is the correct outcome.
#
# The publish itself is safe to repeat: file blobs are content-addressed, and
# the pointer is written last.

on:
  push:
    branches: [main]
    # Nothing here can change the shipped bundle, and publishing one that is
    # byte-identical except for its version string is not free: every device is
    # then offered an update and re-downloads the changed chunks (~8 MB) for a
    # change that cannot affect what they run. `dist/` comes from vite, so only
    # src/, public/, index.html and the build config feed it — server functions
    # under api/, the CI scripts, and the native project do not.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'
      - 'ios-patches/**'
      - 'ios/**'
      - 'scripts/**'
      - 'api/**'
      - 'e2e/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the forward-only guard (deliberate rollback)'
        required: false
        default: 'false'

concurrency:
  group: ota-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # HOLD-BACK SWITCH (David 2026-09-05: "No OTA for this one in case we need
    # to drop back to 3"). A push whose HEAD commit message carries `[skip ota]`
    # deploys the web app as usual but publishes NO bundle, so native devices
    # stay on the previous OTA until a later push (or a manual dispatch) ships
    # one. Use it for a change you want to soak on the web first.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ota]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The publisher reads the commit timestamp for the monotonic ordinal.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build + publish
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OTA_PUBLISH_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN not set — cannot read the project env."
            exit 1
          fi
          npm ci
          npm install -g vercel@latest

          # The bundle's VITE_* values are baked at BUILD time and come from TWO
          # places: the committed `.env.production` (which carries
          # VITE_REVENUECAT_IOS_KEY and VITE_PAYWALL_ENABLED — vite's loadEnv
          # reads it for a production build) and the pulled Vercel project env
          # (PostHog key, provider keys, plus the publisher's Blob + KV creds).
          #
          # 🔥 DO NOT "HELPFULLY" EXPORT VITE_* VARS HERE. On 2026-09-03 this step
          # set VITE_REVENUECAT_IOS_KEY from a GitHub secret that did not exist.
          # The empty string won over `.env.production`, and the bundle published
          # to every device had NO RevenueCat key — the exact defect the change
          # claimed to fix. An env var you inject unconditionally is an env var
          # you inject as empty when its source is missing.
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"

          set -a
          [ -f .vercel/.env.production.local ] && . .vercel/.env.production.local
          set +a

          test -d dist || { echo "::error::the build produced no dist/"; exit 1; }

          # 🔒 CHECK THE ARTIFACT, NOT THE ENVIRONMENT. Reasoning about which env
          # var reaches the bundle is exactly what went wrong; grepping the built
          # JS is the only claim that cannot be wrong. A bundle without the
          # RevenueCat key silently kills purchase, restore and subscription
          # recognition on every native device that applies it, and nothing in
          # the app looks broken — so this must block the publish.
          if ! grep -rlq 'appl_' dist/assets 2>/dev/null; then
            echo "::error::Built bundle has NO RevenueCat appl_ key — publishing it would kill billing on every native device. Refusing."
            exit 1
          fi
          if ! grep -rlq 'phc_' dist/assets 2>/dev/null; then
            echo "::error::Built bundle has no PostHog key — analytics would go dark. Refusing."
            exit 1
          fi
          echo "[ota] artifact verified: RevenueCat + PostHog keys present in dist/" 
          node scripts/ci/publish-ota-bundle.mjs "$(git rev-parse --short=8 HEAD)"

      # Post-check, deliberately NON-FATAL: several of its assertions read the
      # LIVE /api/ota/manifest endpoint, which Vercel's git integration deploys
      # on its own schedule — so right after a publish it may still be serving
      # the previous endpoint build and fail for a reason unrelated to this
      # publish. Loud, not red: a job that goes red on every run gets ignored,
      # and an ignored check is the same as no check.
      - name: Verify the published bundle serves correctly
        continue-on-error: true
        run: |
          node scripts/audit-ota.mjs || echo "::warning::audit-ota reported failures — see the log. If they are endpoint-contract checks, re-run once the web deploy for this commit is live."
