name: Android emulator smoke

# Boot the real app in an Android emulator on CI and assert the React app
# actually MOUNTS in the Capacitor WebView — so we can verify the Android build
# runs WITHOUT owning a physical device. Catches the scary class: crash on
# launch, blank #root (bundle/WASM failed to load), native ANR.
#
# What it CAN'T verify (needs real hardware / closed-test): live microphone
# capture, real audio playback of streaming TTS. Those ride on the 20-tester
# closed test + Firebase Test Lab.

on:
  workflow_dispatch:

concurrency:
  group: android-emulator-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM (hardware accel for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Add + sync Android project, apply patches, generate assets
        run: npm run setup:android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/

      - name: Run app in emulator + assert WebView mount
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci/android-emulator-smoke.sh

      - name: Upload screenshot + logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-evidence
          path: audit-reports/android-smoke/
          if-no-files-found: warn
