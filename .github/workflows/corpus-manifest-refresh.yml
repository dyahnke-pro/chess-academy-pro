# corpus-manifest-refresh — keep the Naroditsky video manifest current
# (David 2026-07-31: the transcript farm's work-queue must not go stale).
#
# Weekly sweep of the teaching playlists + the channel uploads via
# scripts/danya-corpus/fetch-manifest.mjs, committing manifest.json when new
# videos appear. TRANSCRIPTS ARE NOT FETCHED HERE — they are gitignored
# reference material (plagiarism guard) that bake sessions pull on demand
# with yt-dlp. No repo secrets: the default GITHUB_TOKEN pushes the commit.
name: corpus-manifest-refresh

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corpus-manifest-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install yt-dlp
        run: pipx install yt-dlp || pip install --user yt-dlp
      - name: Refresh manifests (playlists + channel sweep, per creator)
        run: |
          node scripts/danya-corpus/fetch-manifest.mjs
          node scripts/danya-corpus/fetch-manifest.mjs --creator hangingpawns
          node scripts/danya-corpus/fetch-manifest.mjs --creator saintlouis
      - name: Commit if changed
        run: |
          # -f: the manifests live under the gitignored data/sources/ tree.
          # Plain `git add` silently added nothing, so this job reported
          # success while committing nothing for weeks (fixed 2026-07-31).
          git add -f data/sources/*-voice/manifest.json
          if git diff --cached --quiet; then
            echo "manifests unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(corpus): weekly manifest refresh (new uploads)"
          git push
