name: Board touch probe (WebKit, iPhone)

# Taps a piece and a square on the Coach boards on WebKit — the engine inside
# the iPhone app — at iPhone size with touch, against prod. By hand only.
on:
  workflow_dispatch:
    inputs:
      routes:
        description: 'Comma-separated routes'
        required: false
        default: '/coach/play,/coach/teach,/coach/campaign'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npx playwright install --with-deps webkit
      - name: Probe
        env:
          AUDIT_SMOKE_URL: https://chess-academy-pro.vercel.app
          PROBE_BROWSER: webkit
          PROBE_ROUTES: ${{ github.event.inputs.routes }}
          PROBE_OUT: audit-reports/probe/p
        run: mkdir -p audit-reports/probe && node scripts/probe-board-touch.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board-touch-probe-${{ github.run_id }}
          path: audit-reports/probe/
          retention-days: 7
