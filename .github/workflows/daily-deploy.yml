name: Daily deploy + TestFlight external (21:00 America/Chicago)

# David's cadence (2026-06-13): hold releases during the day, ship nightly. This
# scheduled job, but ONLY when main actually advanced since the last build:
#   1. Deploys the web app to Vercel production (git auto-deploy is disabled at
#      the Vercel side — project Ignored Build Step = `exit 0` — so this job is
#      the ONLY thing that promotes main to production).
#   2. Sends the latest VALID iOS build (marketing version pinned to 3.2 in
#      ios/App/ci_scripts/ci_post_clone.sh) to the external "Beta Test" group
#      (+ internal), and submits it for Beta App Review.
#
# We fire at both 02:00 and 03:00 UTC — ~21:00 Chicago, and two crons for
# delivery redundancy (GitHub drops/delays scheduled runs under load). There is
# NO wall-clock hour gate: it silently skipped every run because GitHub delivers
# these crons hours late (David 2026-07-01). The real gate is "Detect changes
# since last build" below — main-changed.mjs ships ONLY when main advanced past
# the last built commit, so a no-work day = no build. concurrency + main-changed
# dedup the two crons (the second sees the first build's commit == HEAD, skips).

# 🔒 AUTO-SUBMIT TO APPLE DISABLED (David 2026-07-11: "stop the auto send").
# Build 120 was auto-submitted by the old nightly cron and Apple rejected it.
# That order STANDS for Apple: scheduled runs force SKIP_IOS, so no build is
# ever created for or submitted to Apple on a schedule. The nightly crons were
# RESTORED for WEB + OTA only (David 2026-07-21: "the auto deploy has not been
# working") — the Vercel deploy and the OTA JS bundle ship themselves nightly;
# iOS/TestFlight remains manual-dispatch (or trigger-file) only.
on:
  # Trigger-file build (David 2026-07-11 workaround): the agent proxy 403s the
  # Actions dispatch API AND tag pushes, but a normal branch push to main is
  # allowed and GitHub runs the workflow itself (no proxy). So a push to main
  # that changes the `.ci-build-trigger` file fires an INTERNAL-only build
  # (event is 'push', no external input → TF_EXTERNAL empty → no external email).
  # A NORMAL commit does NOT trigger this — only a change to that one file — so
  # it is not an auto-send; you build by bumping .ci-build-trigger and pushing.
  push:
    branches: [main]
    paths:
      - '.ci-build-trigger'
  workflow_dispatch:       # manual on-demand run (external opt-in below)
    inputs:
      external:
        description: 'Also push to EXTERNAL beta testers (sends a tester email). Default OFF — internal-only, no tester email.'
        type: boolean
        default: false
  # Nightly WEB + OTA ONLY (David 2026-07-21: "the auto deploy has not been
  # working"). The 2026-07-11 "stop the auto send" order STANDS for Apple:
  # scheduled runs force SKIP_IOS below, so nothing is built for or submitted
  # to Apple on a schedule — only the Vercel web deploy + the OTA JS bundle
  # ship nightly. iOS/TestFlight remains manual-dispatch or trigger-file only.
  schedule:
    - cron: '0 2 * * *'   # ~21:00 America/Chicago (delivery is best-effort)
    - cron: '0 3 * * *'   # redundancy — main-changed dedups the second run

concurrency:
  group: daily-deploy
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_EG9m215w9cQHWilBOPnOtIFS
      VERCEL_PROJECT_ID: prj_qYJMwF1apaxdp6sIZzcvZMz9BcZN
    steps:
      - name: Gate (schedule fires whenever GitHub delivers it; main-changed is the work-gate)
        id: gate
        # The old gate proceeded ONLY when the Chicago wall-clock hour == 21. That
        # silently skipped EVERY scheduled run: GitHub Actions delivers scheduled
        # crons late and unevenly (the 02:00/03:00 UTC crons were observed firing
        # at 06:00-07:00 UTC → Chicago 01:00-02:00, never "21"), so the job 4-8s
        # no-op'd while reporting green — the nightly external build hadn't fired in
        # a week (David 2026-07-01). Timing is intentionally flexible now (David:
        # "changing the timing is fine"): the deploy fires whenever the cron is
        # delivered. The REAL gate is the "Detect changes since last build" step
        # below — `main-changed.mjs` ships ONLY when main advanced past the last
        # built commit, so no new work => no build, no deploy, no TestFlight email.
        # The two daily crons + `concurrency` are pure delivery redundancy: the
        # second run's main-changed sees the first build's commit == HEAD and skips.
        run: echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history so the "What to Test" step's `git log --since` sees
          # every commit since the last build, not just the tip. Default
          # depth-1 (shallow) made the tester notes list only the HEAD commit
          # and drop the real user-facing changes (David 2026-07-01, build 83).
          fetch-depth: 0

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Only do anything if main actually advanced since the last build — no
      # changes => no build, no deploy, no TestFlight submission, no tester
      # email. (Prevents a pointless daily build/email when nothing changed.)
      - name: Detect changes since last build
        id: changed
        if: steps.gate.outputs.run == 'true'
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "ship=true" >> "$GITHUB_OUTPUT"   # can't check without creds — ship
            exit 0
          fi
          HEAD_SHA="$(git rev-parse HEAD)" node scripts/ci/main-changed.mjs

      # --- Web: Vercel production deploy --------------------------------------
      - name: Deploy web to Vercel production
        id: webdeploy
        if: steps.gate.outputs.run == 'true' && steps.changed.outputs.ship == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set — add it under Settings → Secrets → Actions."
            exit 1
          fi
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"

          # 🔒 NEVER DEPLOY A COMMIT THAT MAIN HAS ALREADY MOVED PAST.
          #
          # TWO PATHS DEPLOY PRODUCTION — Vercel's git integration on every push
          # to main, and this step. They race, and the one that FINISHES last
          # takes the alias regardless of which commit is newer.
          #
          # Measured 2026-08-12: this workflow started at 04:44:13 and checked
          # out b1ba9836. Fifty seconds later a fix landed on main; its git-
          # integration deploy went live at 04:45:03. This step then finished at
          # 04:46:44 and rolled production back to b1ba9836. The fix was on main,
          # CI was green, and paying users were served the code without it —
          # exactly the class of silent non-ship the post-deploy audit exists to
          # catch, arriving from our own pipeline.
          #
          # A scheduled run can sit queued for an hour on a busy repo, so this
          # window is wide and hit regularly. Re-check main at DEPLOY time: if it
          # has moved, the git integration is already shipping something newer
          # and our job is to get out of its way.
          git fetch origin main --quiet
          REMOTE_MAIN="$(git rev-parse origin/main)"
          BUILT="$(git rev-parse HEAD)"
          if [ "$REMOTE_MAIN" != "$BUILT" ]; then
            echo "::warning::main advanced to ${REMOTE_MAIN:0:8} while this run built ${BUILT:0:8} — skipping the web deploy so a newer commit is not rolled back."
            echo "## Web deploy skipped — main moved to \`${REMOTE_MAIN:0:8}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "shipped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Production deploy: $url"
          echo "shipped=true" >> "$GITHUB_OUTPUT"
          echo "## Web deploy 🚀 $url" >> "$GITHUB_STEP_SUMMARY"

      # Publish the just-built web bundle as a self-hosted OTA update (David
      # 2026-07-03; RE-ENABLED 2026-07-17 after the 07-11 disable — "put it back
      # on") so devices on an autoUpdate:true build pick up content/JS changes on
      # next open — no TestFlight round-trip. NON-FATAL: OTA is an enhancement; a
      # hiccup must not red the deploy or block the iOS build. `vercel build`
      # above left dist/ in place and `vercel pull` wrote the project env
      # (BLOB_READ_WRITE_TOKEN + KV creds) to .vercel/.env.production.local.
      # Gated on the web deploy having ACTUALLY shipped: if the step above stood
      # down because main moved, this dist/ is the superseded commit's, and
      # pushing it as an OTA would roll every auto-updating device back to the
      # code production just stopped serving.
      - name: Publish OTA bundle
        if: steps.gate.outputs.run == 'true' && steps.changed.outputs.ship == 'true' && steps.webdeploy.outputs.shipped == 'true'
        continue-on-error: true
        run: |
          set -a
          [ -f .vercel/.env.production.local ] && . .vercel/.env.production.local
          set +a
          if [ ! -d dist ]; then npm run build; fi
          node scripts/ci/publish-ota-bundle.mjs "$(git rev-parse --short=8 HEAD)" \
            || echo "::warning::OTA bundle publish failed (non-fatal) — testers stay on their current bundle."

      # --- iOS: build once (per-push auto-builds are off) then distribute -----
      # Per-push Xcode Cloud builds are disabled (the workflow's branch trigger
      # points at a dead branch), so this job is the ONLY thing that produces an
      # iOS build — one per day, and only when main changed. trigger-ios-build
      # fires the build of main and waits until it's VALID; distribute then
      # sends THAT build out.
      # Decoupled from the web-deploy step: `!cancelled()` lets the iOS build +
      # Apple submission proceed even if the Vercel deploy above failed (the web
      # is deployed by Vercel's own git integration too, so a deploy hiccup must
      # not block the TestFlight/Beta-Review submission). The job still goes red
      # if web deploy failed, so the failure stays visible.
      - name: Build iOS (Xcode Cloud) and wait for VALID
        id: iosbuild
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' && steps.changed.outputs.ship == 'true' }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled run — web + OTA only. iOS/TestFlight stays manual (David 2026-07-11: no auto-send to Apple)."
            echo "SKIP_IOS=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "::warning::APP_STORE_CONNECT_API_* secrets not set — skipping iOS build + distribution."
            echo "SKIP_IOS=1" >> "$GITHUB_ENV"
            exit 0
          fi
          node scripts/ci/trigger-ios-build.mjs

      # Build a real "What to Test" from this build's actual changes — the
      # user-facing feat/fix/perf commit subjects since the last build, with
      # the conventional-commit prefixes stripped (David 2026-06-17: "better
      # descriptions on the What to Test"). Replaces the old generic
      # boilerplate. Manual override still wins via a TF_WHATS_NEW env.
      - name: Compose "What to Test" notes
        if: ${{ steps.iosbuild.outcome == 'success' && steps.gate.outputs.run == 'true' && steps.changed.outputs.ship == 'true' && env.SKIP_IOS != '1' }}
        run: |
          NOTES=$(git log --since="26 hours ago" --no-merges --pretty='%s' \
            | grep -iE '^(feat|fix|perf)(\(|!|:)' \
            | sed -E 's/^(feat|fix|perf)(\([^)]*\))?!?:[[:space:]]*//' \
            | sed -E 's/^(.)/\U\1/' \
            | head -12 \
            | sed 's/^/• /')
          [ -z "$NOTES" ] && NOTES="• Bug fixes and stability improvements."
          {
            echo 'TF_WHATS_NEW<<WTNEOF'
            echo "What's new in this build — please test these and report anything that looks off:"
            echo ''
            echo "$NOTES"
            echo ''
            echo 'Focus areas: Learn-with-Coach + Play-with-Coach (typing questions, voice narration), board arrows/highlights, and general navigation.'
            echo 'WTNEOF'
          } >> "$GITHUB_ENV"

      # Gate on the iOS build step SUCCEEDING (not just `!cancelled()`): if the
      # Xcode Cloud trigger failed — e.g. Apple's POST /v1/ciBuildRuns throws a
      # transient 500 (2026-06-19 incident) — there is NO fresh build, and
      # `!cancelled()` would wrongly distribute the previous VALID build (stale),
      # then 422 on beta-review-submit because that build is already submitted.
      # `steps.iosbuild.outcome == 'success'` still preserves the web-deploy
      # decoupling (we don't reference the web step), while refusing to ship a
      # stale build when no new one was produced.
      - name: Distribute iOS build to TestFlight (internal always; external only on the nightly run or explicit opt-in)
        if: ${{ steps.iosbuild.outcome == 'success' && steps.gate.outputs.run == 'true' && steps.changed.outputs.ship == 'true' && env.SKIP_IOS != '1' }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          # External (which emails beta testers) ONLY on the scheduled nightly
          # run, or when a manual run explicitly opts in. Per-push / on-demand
          # manual builds stay INTERNAL-ONLY so testers aren't flooded with an
          # email per build (David 2026-06-17). TF_WHATS_NEW is composed above.
          TF_EXTERNAL: ${{ (github.event_name == 'schedule' || github.event.inputs.external == 'true') && '1' || '' }}
        run: |
          node scripts/ci/distribute-testflight.mjs
          if [ "${TF_EXTERNAL}" = "1" ]; then
            echo "## iOS built + sent to EXTERNAL (Beta App Review) + internal 📲" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## iOS built + sent to INTERNAL only (no beta-tester email) 📲" >> "$GITHUB_STEP_SUMMARY"
          fi
