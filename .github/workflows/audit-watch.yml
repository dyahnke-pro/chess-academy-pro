name: Voice failure watch (cron)

# Always-on watcher for voice/TTS failures in the live app. Polls the
# audit-stream every ~10 min and, when a tester hits a voice failure
# (tts-failure / polly-fallback / voice-fallover — including the iOS
# <audio>-element playback errors), pings David by commenting on a
# dedicated tracking issue.
#
# State (the "last alerted" cursor) lives in the issue body as a
# `<!--cursor:MS-->` marker, so we never re-alert the same events and
# need no external store. AUDIT_STREAM_SECRET is already a repo secret.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: audit-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  WATCH_ISSUE_TITLE: '🔊 Voice failure watch'
  FALLBACK_LOOKBACK_MS: '86400000' # 24h on first run (no cursor yet)

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find/create tracking issue + read cursor
        id: cursor
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.WATCH_ISSUE_TITLE;
            const fallback = Number(process.env.FALLBACK_LOOKBACK_MS);
            const { owner, repo } = context.repo;
            // Find an existing open watch issue.
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            let issue = issues.data.find((i) => i.title === title && !i.pull_request);
            if (!issue) {
              const created = await github.rest.issues.create({
                owner, repo, title,
                body: `Automated watcher for live voice/TTS failures. Comments below are posted by the \`audit-watch\` cron when a failure is seen in the audit-stream.\n\n<!--cursor:0-->`,
              });
              issue = created.data;
            }
            const m = (issue.body || '').match(/<!--cursor:(\d+)-->/);
            const cursor = m ? Number(m[1]) : 0;
            const since = cursor > 0 ? cursor : (Date.now() - fallback);
            core.setOutput('issueNumber', String(issue.number));
            core.setOutput('since', String(since));
            core.setOutput('body', issue.body || '');

      - name: Pull audit-stream + filter voice failures
        id: watch
        env:
          AUDIT_STREAM_SECRET: ${{ secrets.AUDIT_STREAM_SECRET }}
          SINCE_MS: ${{ steps.cursor.outputs.since }}
          OUT_FILE: /tmp/voice-failures.json
        run: node scripts/watch-voice-failures.mjs

      - name: Alert on failures + advance cursor
        if: steps.watch.outputs.hasFailures == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.cursor.outputs.issueNumber }}
          MAX_TS: ${{ steps.watch.outputs.maxTs }}
          PREV_BODY: ${{ steps.cursor.outputs.body }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const maxTs = Number(process.env.MAX_TS);
            const data = JSON.parse(fs.readFileSync('/tmp/voice-failures.json', 'utf8'));
            const lines = data.failures.map((f) => {
              const when = new Date(f.timestamp).toISOString();
              return `- \`${when}\` **${f.kind}** (${f.source}) — ${f.summary}`;
            });
            const body = [
              `### ⚠️ ${data.failures.length} voice failure(s) detected`,
              '',
              ...lines,
              '',
              `<sub>window since ${new Date(data.since).toISOString()} · run ${context.runId}</sub>`,
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            // Advance the cursor in the issue body so we don't re-alert.
            const prev = process.env.PREV_BODY || '';
            const next = prev.match(/<!--cursor:\d+-->/)
              ? prev.replace(/<!--cursor:\d+-->/, `<!--cursor:${maxTs}-->`)
              : `${prev}\n<!--cursor:${maxTs}-->`;
            await github.rest.issues.update({ owner, repo, issue_number: issueNumber, body: next });
