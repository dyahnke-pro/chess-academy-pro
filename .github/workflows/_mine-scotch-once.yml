name: _mine-scotch-once (temporary)

# TEMPORARY, self-cleaning helper (delete after the Scotch gems land). The web
# sandbox can't reach the amateur Lichess explorer (the gem source). GitHub
# Actions runners have open network, so this mines scotch-game with a real
# Stockfish and commits the refreshed punish-gems.json back to THIS branch
# (chore/scotch-gems), which is then narrated + merged to main. Path-filtered
# to its own file so the gems commit doesn't re-trigger it.

on:
  push:
    branches:
      - chore/scotch-gems
    paths:
      - '.github/workflows/_mine-scotch-once.yml'

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Mine Scotch punish-gems (live amateur explorer + engine)
        env:
          STOCKFISH_PATH: /usr/games/stockfish
          OPENINGS: scotch-game
        run: node scripts/mine-punish-gems.mjs
      - name: Show mined gems
        run: node -e "const g=require('./src/data/punish-gems.json');const it=g.filter(x=>x.openingId==='scotch-game');console.log('scotch gems:',it.length);for(const x of it)console.log(' ',x.lineMoves,'|',x.inaccuracy,'->',x.punish,'['+x.tier,x.engineCp+'cp]');"
      - name: Commit gems back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/punish-gems.json
          git diff --cached --quiet || git commit -m "chore(gems): mine Scotch punish-gems on CI (engine-confirmed)"
          git push
