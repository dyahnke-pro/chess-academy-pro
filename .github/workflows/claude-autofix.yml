name: Claude auto-fix (from error digest)

# Spawns an autonomous Claude Code session to triage a batch of live errors
# and open a DRAFT PR with a fix. Reusable two ways:
#   - workflow_call  — invoked by posthog-error-watch when NEW crashes appear
#                      (the digest is passed in).
#   - workflow_dispatch — fire manually with a pasted error digest.
#
# Claude opens a DRAFT PR only; it never pushes to main. David reviews + merges.
#
# Brain: the REAL frontier Claude model (David 2026-07-01: "can't it just trigger
#   YOU to start a fix?"). The prior DeepSeek-via-proxy routing is retired — the
#   headless DeepSeek agent could NOT complete a real triage within the turn
#   budget (effectiveness test 2026-07-01: 100 turns, no PR). Auth comes from a
#   Claude subscription OAuth token `CLAUDE_CODE_OAUTH_TOKEN` (run `claude
#   setup-token` to mint one) OR a funded `ANTHROPIC_API_KEY` — add EITHER as a
#   repo Actions secret (Settings → Secrets → Actions). If neither is set the run
#   SKIPS cleanly with a ::warning:: (no hard failure on the watcher cron).

on:
  workflow_call:
    inputs:
      error_digest:
        description: 'Newline-separated list of live errors to triage + fix.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      error_digest:
        description: 'Error summary (one per line) to triage + fix.'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write   # required for claude-code-action to mint its OIDC token
                    # (without it every autofix run died: "Could not fetch an
                    # OIDC token ... add id-token: write")

concurrency:
  group: claude-autofix
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Gate on a frontier-Claude credential. Secrets can't be read in a job-level
      # `if:`, so check here and skip the rest cleanly when neither is set — this
      # keeps the watcher cron GREEN (no hard failure) until the token is added.
      - name: Require a frontier-Claude credential
        id: cred
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$APIKEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret set — skipping real-Claude autofix. Add one (run \`claude setup-token\` for the OAuth token) under Settings → Secrets → Actions to enable it."
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cred.outputs.have == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.cred.outputs.have == 'true'
        with:
          node-version: '20'

      - name: Install deps
        if: steps.cred.outputs.have == 'true'
        run: npm ci --no-audit --no-fund

      - name: Claude triage + fix
        if: steps.cred.outputs.have == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # Lets the triage step run `gh pr list` to check for prior autofix
          # attempts on the same error (the anti-bandaid gate) before patching.
          GH_TOKEN: ${{ github.token }}
        with:
          # Real frontier Claude — a subscription OAuth token is preferred (no
          # per-token bill); a funded API key also works. One of these is
          # guaranteed present by the `cred` gate above. Model defaults to a
          # current Claude model (no ANTHROPIC_MODEL / base-url override).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Beta testers hit these live errors in production (from PostHog Error Tracking):

            ${{ inputs.error_digest }}

            You are working in the chess-academy-pro repo. Read
            `.github/AUTOFIX_GUIDE.md` first — it is the CONDENSED operating
            guide (gates, voice rules, triage, code conventions) for autofix.
            Do NOT read the full CLAUDE.md (~400KB) — pulling it into context
            every turn exhausts your token/turn budget (it crashed earlier runs
            at max-turns). Grep CLAUDE.md ONLY for rules specific to the files
            you change (e.g. `grep -n "<subsystem>" CLAUDE.md`). Your job:

            1. TRIAGE: pick the single highest-impact GENUINE CODE BUG in the list
               (prefer high occurrence-count crashes: uncaught-error /
               unhandled-rejection / continuity-error / sanitizer-leak / IndexedDB
               transaction errors). SKIP items that are architectural grounding
               signals rather than fixable crashes (claim-validator-trip,
               master-play-enforcement-fallback) — note them but don't try to
               "fix" them with a code patch. ALSO SKIP `ProviderTokensEmpty`
               (a provider ran out of tokens/credits) — that's an ops alert for
               David to top up the account, NOT a code bug; never open a PR for
               it, just note it.
               A `coach non-answer` item is DIFFERENT and IS fixable: the coach
               connected but didn't address the question (reason 're-ask' /
               'fallback-or-greeting'). The usual root cause is an intent
               classifier in src/coach/coachService.ts not recognizing the
               phrasing — broaden the matching router the same way
               src/coach/questionIntents.test.ts does (the "thesaurus" pattern),
               and add the failing phrasing to that test.
            1.5 CHECK PRIOR ATTEMPTS (anti-bandaid gate — MANDATORY, do this before
               writing any code). Each autofix run is stateless, so without this it
               re-patches the same symptom forever. Run
               `gh pr list --state all --search "fix <keyword>" --limit 20` AND
               `git branch -r --list 'origin/fix/*<keyword>*'` (keyword = the crashing
               subsystem, e.g. stockfish / transaction / sanitizer). If ≥2 prior
               PRs/branches already target this SAME error or symptom, DO NOT open
               another patch — per CLAUDE.md "if fix N+1 treats the same symptom from a
               different angle, the disease is architectural — stop and invert."
               Either implement the architectural ROOT CAUSE the prior bandaids danced
               around, or open NO PR and comment the escalation on the tracking issue.
               A better error MESSAGE, a dedup window, a wider try/catch, or "suppress
               spurious X" is DIAGNOSTICS, not a crash fix (see AUTOFIX_GUIDE.md).
            2. ROOT CAUSE: find the disease, not just the symptom. Grep for every
               other instance of the same pattern (CLAUDE.md "sweep, don't spot-fix").
               For a crash (OOM / worker init-fail / uncaught), the fix must change
               WHY it happens (resource/lifecycle/variant/guard), not how it's reported.
            3. FIX: minimal, surgical changes. No unrelated refactors.
            4. VERIFY: run `npm run ship-check` — typecheck + lint + content gates
               must pass.
            5. Open a DRAFT pull request against main titled `fix: <bug>`, with a
               body that names the error, the root cause, the fix, and what you
               could NOT verify from CI (e.g. the live 3-instrument prod audit,
               which David runs after merge per G1). Do NOT push to main.

            If none of the items is a genuinely fixable code bug, open NO PR — instead
            comment your triage conclusion on the `🐛 PostHog error watch` tracking issue.
          # --max-turns was 30 — too low: EVERY run that actually fired hit
          # `error_max_turns` and opened no PR (David 2026-06-30, run
          # 28476260047 — 31 turns, errored). The task is read the ~400KB
          # CLAUDE.md + triage + sweep + FIX + `npm run ship-check` (~4 min =
          # a whole turn) + open a draft PR; that can't complete in 30. 100
          # gives headroom and only fires on NEW deduped errors, so cost stays
          # bounded. (The watcher's "success" runs were just no-new-error
          # cycles where this autofix job was skipped.)
          claude_args: |
            --max-turns 100
            --allowedTools Edit,Write,Read,Grep,Glob,Bash

      # ── SAY WHY IT FAILED ──────────────────────────────────────────────────
      #
      # 🔒 A RED RUN THAT EXPLAINS NOTHING IS A RED RUN NOBODY ACTS ON. Six
      # consecutive watch cycles failed here and the only evidence anywhere was
      # `Action failed with error: Claude execution failed: result is_error:true`
      # — the action hides its output by design (`show_full_output` would dump
      # the transcript, and this repo's runners carry real credentials, so
      # turning that on is not an option).
      #
      # The action does leave a structured result at a known path. This reads
      # ONLY the scalar outcome fields — subtype, is_error, num_turns,
      # duration, cost, permission denials — never the transcript, so nothing
      # secret can ride out. That handful of numbers is enough to separate the
      # three failure modes that actually happen:
      #   num_turns 1 + $0            → the API call never landed (auth, credit,
      #                                 rate limit) — an ops fix, not a code one
      #   num_turns at the cap        → ran out of turns mid-task
      #   subtype error_during_execution → it genuinely fell over working
      #
      # Measured 2026-08-12 on run 31557114583: 1 turn, $0, 178s. That is the
      # first case, and no amount of staring at the workflow would have said so.
      - name: Report why the fixer failed
        if: failure() && steps.cred.outputs.have == 'true'
        run: |
          LOG=/home/runner/work/_temp/claude-execution-output.json
          if [ ! -f "$LOG" ]; then
            echo "::warning::autofix failed before it produced a result file — the action did not start."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            let raw;
            try { raw = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
            catch { console.log("::warning::autofix result file was not valid JSON"); process.exit(0); }
            const rows = Array.isArray(raw) ? raw : [raw];
            const r = rows.reverse().find((x) => x && x.type === "result") ?? {};
            const turns = r.num_turns ?? 0;
            const cost = r.total_cost_usd ?? 0;
            const secs = Math.round((r.duration_ms ?? 0) / 1000);
            let why = "unclassified — read the run log";
            if (turns <= 1 && cost === 0) {
              why = "the model API call never landed (auth / credit / rate limit). "
                  + "Rotate ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN in repo secrets — this is an ops fix, not a code one.";
            } else if (r.subtype === "error_max_turns") {
              why = "ran out of turns before finishing the fix — raise --max-turns or narrow the task.";
            } else if (r.subtype === "error_during_execution") {
              why = "the session failed partway through the task.";
            }
            const line = `autofix did not complete: ${why} [subtype=${r.subtype ?? "?"} turns=${turns} cost=$${cost} ${secs}s]`;
            console.log(`::warning::${line}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Autofix did not complete\n\n${why}\n\n\`subtype=${r.subtype ?? "?"} turns=${turns} cost=$${cost} duration=${secs}s\`\n`);
          ' "$LOG"
