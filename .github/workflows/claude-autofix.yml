name: Claude auto-fix (from error digest)

# Spawns an autonomous Claude Code session to triage a batch of live errors
# and open a DRAFT PR with a fix. Reusable two ways:
#   - workflow_call  — invoked by posthog-error-watch when NEW crashes appear
#                      (the digest is passed in).
#   - workflow_dispatch — fire manually with a pasted error digest.
#
# Claude opens a DRAFT PR only; it never pushes to main. David reviews + merges.
#
# Brain: DeepSeek, via the app's OWN Vercel proxy — NO repo secret required.
#   The proxy (/api/llm/deepseek/anthropic) holds the DeepSeek key server-side
#   and injects it, so this workflow ships no LLM credential. See the env on the
#   "Claude triage + fix" step. (Earlier this needed an Anthropic key, which was
#   out of credits and errored at $0 — David's call to route through the proxy.)

on:
  workflow_call:
    inputs:
      error_digest:
        description: 'Newline-separated list of live errors to triage + fix.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      error_digest:
        description: 'Error summary (one per line) to triage + fix.'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write   # required for claude-code-action to mint its OIDC token
                    # (without it every autofix run died: "Could not fetch an
                    # OIDC token ... add id-token: write")

concurrency:
  group: claude-autofix
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Claude triage + fix
        uses: anthropics/claude-code-action@v1
        env:
          # DeepSeek is the PRIMARY brain — reached through the app's OWN Vercel
          # proxy, which already holds the DeepSeek key server-side (David
          # 2026-06-14: "the app already has the key — make deepseek primary").
          # No GitHub secret needed: Claude Code speaks the Anthropic protocol to
          # DeepSeek's Anthropic-compatible endpoint via the proxy; the proxy
          # strips the client auth and injects the real DeepSeek key. A GitHub
          # Action sends no Origin header, which the proxy's gate allows.
          # Verified 2026-06-14: POST …/api/llm/deepseek/anthropic/v1/messages
          # returns a proper Anthropic message from deepseek-v4-flash.
          ANTHROPIC_BASE_URL: https://chess-academy-pro.vercel.app/api/llm/deepseek/anthropic
          ANTHROPIC_MODEL: deepseek-chat
        with:
          # Dummy sentinel — satisfies the action's credential precheck. The
          # real auth is injected by the Vercel proxy; whatever Claude Code
          # sends here is stripped upstream.
          anthropic_api_key: proxy
          prompt: |
            Beta testers hit these live errors in production (from PostHog Error Tracking):

            ${{ inputs.error_digest }}

            You are working in the chess-academy-pro repo. Read CLAUDE.md first — its
            gates and voice rules apply. Your job:

            1. TRIAGE: pick the single highest-impact GENUINE CODE BUG in the list
               (prefer high occurrence-count crashes: uncaught-error /
               unhandled-rejection / continuity-error / sanitizer-leak / IndexedDB
               transaction errors). SKIP items that are architectural grounding
               signals rather than fixable crashes (claim-validator-trip,
               master-play-enforcement-fallback) — note them but don't try to
               "fix" them with a code patch. ALSO SKIP `ProviderTokensEmpty`
               (a provider ran out of tokens/credits) — that's an ops alert for
               David to top up the account, NOT a code bug; never open a PR for
               it, just note it.
               A `coach non-answer` item is DIFFERENT and IS fixable: the coach
               connected but didn't address the question (reason 're-ask' /
               'fallback-or-greeting'). The usual root cause is an intent
               classifier in src/coach/coachService.ts not recognizing the
               phrasing — broaden the matching router the same way
               src/coach/questionIntents.test.ts does (the "thesaurus" pattern),
               and add the failing phrasing to that test.
            2. ROOT CAUSE: find the disease, not just the symptom. Grep for every
               other instance of the same pattern (CLAUDE.md "sweep, don't spot-fix").
            3. FIX: minimal, surgical changes. No unrelated refactors.
            4. VERIFY: run `npm run ship-check` — typecheck + lint + content gates
               must pass.
            5. Open a DRAFT pull request against main titled `fix: <bug>`, with a
               body that names the error, the root cause, the fix, and what you
               could NOT verify from CI (e.g. the live 3-instrument prod audit,
               which David runs after merge per G1). Do NOT push to main.

            If none of the items is a genuinely fixable code bug, open NO PR — instead
            comment your triage conclusion on the `🐛 PostHog error watch` tracking issue.
          claude_args: |
            --max-turns 30
            --allowedTools Edit,Write,Read,Grep,Glob,Bash
