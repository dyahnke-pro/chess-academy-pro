<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- manifest injected by vite-plugin-pwa -->
    <title>Chess Academy Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Force SW update check on every page load
      if ('serviceWorker' in navigator) {
        // r.update() rejects ("Failed to update a ServiceWorker … Not found")
        // when the SW-script fetch transiently fails/races (cold headless
        // context, CDN miss, mid-deploy). It's benign — the browser retries on
        // the next load — but WITHOUT a catch it surfaces as an unhandled
        // rejection / pageerror (caught in the 2026-06-01 loop audit). Swallow it.
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) {
            try { var p = r.update(); if (p && p.catch) p.catch(function() {}); } catch (e) { /* ignore */ }
          });
        }).catch(function() {});
        // Reload once when a new SW activates
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) { refreshing = true; location.reload(); }
        });
      }
    </script>
  </body>
</html>
